<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/login.css" />
  <title>Form Daftar</title>
</head>

<body>
  <div class="card-login">
    <a href="index.html" class="close-btn"><i class="bi bi-x-lg"></i></a>
    <img src="img/logo.png" alt="logo" class="logo" />
    <hr />
    <h1>Daftar</h1>
    <form>
      <div class="form-item">
        <label for="nama">Nama</label>
        <input type="text" id="nama" placeholder="Masukkan nama anda" />
      </div>

      <div class="form-item">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Masukkan email anda" />
      </div>

      <div class="form-item">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password anda" />
      </div>

      <div class="form-item">
        <label for="password">Re-Password</label>
        <input type="password" id="password" placeholder="Masukkan kembali password anda" />
      </div>

      <button type="submit" class="btn">Daftar</button>

      <div class="register-link">
        Sudah punya akun? <a href="login.html">Login</a>
      </div>
    </form>
  </div>
</body>
</html>
<script>
  const menuToggle = document.querySelector(".menu-toggle");
  const navMenu = document.querySelector(".nav-menu");

  menuToggle.addEventListener("click", () => {
    navMenu.classList.toggle("active");
  });
</script>
