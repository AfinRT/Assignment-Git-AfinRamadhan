<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/login.css" />
  <title>Form Login</title>
</head>

<body>
  <div class="card-login">
    <a href="index.html" class="close-btn"><i class="bi bi-x-lg"></i></a>
    <img src="img/logo.png" alt="logo" class="logo" />
    <hr />
    <h1>Masuk</h1>
   
    <form>
      <div class="form-item">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Masukkan email anda" />
      </div>

      <div class="form-item">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password anda" />
        <a href="#">Lupa password?</a>
      </div>
      <button type="submit" class="btn">Masuk</button>
    </form>

    <div class="separator">atau</div>

    <button type="button" class="btn-google">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/3840px-Google_%22G%22_logo.svg.png"
        alt="Google Logo" class="google" />
      Masuk dengan Google
    </button>

    <div class="register-link">
      Belum punya akun? <a href="daftar.html">Daftar</a>
    </div>
  </div>
</body>

</html>
